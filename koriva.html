    <style>
        :root {
            --bg-primary: #0a0f1a;
            --bg-secondary: #111827;
            --bg-card: #1a2235;
            --text-primary: #f1f5f9;
            --text-secondary: #94a3b8;
            --border-color: #1e293b;
            --accent: #d4a843;
            --accent-light: #e2c87a;
            --success: #10b981;
            --danger: #f43f5e;
            --warning: #f59e0b;
            --info: #3b82f6;
            --sidebar-width: 260px;
            --header-height: 64px;
            --transition-speed: 0.2s;
        }
        .light {
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --border-color: #e2e8f0;
        }
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: 'Inter', system-ui, sans-serif;
            transition: background-color 0.3s, color 0.3s;
            overflow-x: hidden;
        }
        .sidebar {
            width: var(--sidebar-width);
            background: var(--bg-secondary);
            border-right: 1px solid var(--border-color);
            height: 100vh;
            position: fixed;
            left: 0;
            top: 0;
            z-index: 40;
            overflow-y: auto;
            transition: transform 0.3s ease;
        }
        .main-content {
            margin-left: var(--sidebar-width);
            min-height: 100vh;
            padding-top: var(--header-height);
            transition: margin-left 0.3s ease;
        }
        .top-bar {
            height: var(--header-height);
            background: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            position: fixed;
            top: 0;
            left: var(--sidebar-width);
            right: 0;
            z-index: 30;
            display: flex;
            align-items: center;
            padding: 0 1.5rem;
            transition: left 0.3s ease;
        }
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 1.5rem;
            transition: all 0.2s ease;
        }
        .card:hover {
            border-color: rgba(212, 168, 67, 0.3);
            box-shadow: 0 4px 24px rgba(0, 0, 0, 0.2);
        }
        .badge-sim {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            background: rgba(212, 168, 67, 0.15);
            color: #d4a843;
            border: 1px solid rgba(212, 168, 67, 0.3);
        }
        .badge-demo {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 3px 8px;
            border-radius: 16px;
            font-size: 0.65rem;
            font-weight: 600;
            letter-spacing: 0.3px;
            text-transform: uppercase;
            background: rgba(59, 130, 246, 0.12);
            color: #60a5fa;
            border: 1px solid rgba(59, 130, 246, 0.25);
        }
        .nav-item {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 10px 16px;
            margin: 2px 8px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.15s ease;
            font-size: 0.875rem;
            font-weight: 500;
            color: var(--text-secondary);
            text-decoration: none;
            position: relative;
        }
        .nav-item:hover {
            background: rgba(212, 168, 67, 0.08);
            color: var(--text-primary);
        }
        .nav-item.active {
            background: rgba(212, 168, 67, 0.15);
            color: #d4a843;
            font-weight: 600;
        }
        .nav-item.active::before {
            content: '';
            position: absolute;
            left: 0;
            top: 8px;
            bottom: 8px;
            width: 3px;
            background: #d4a843;
            border-radius: 0 3px 3px 0;
        }
        .nav-section {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            color: var(--text-secondary);
            padding: 16px 16px 6px;
            opacity: 0.7;
        }
        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            animation: pulse 2s infinite;
            display: inline-block;
        }
        @keyframes pulse {
            0%,
            100% {
                box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.6);
            }
            50% {
                box-shadow: 0 0 0 12px rgba(16, 185, 129, 0);
            }
        }
        @keyframes flowDash {
            to {
                stroke-dashoffset: -40;
            }
        }
        .flow-line {
            stroke-dasharray: 8 6;
            animation: flowDash 1.5s linear infinite;
        }
        .glass {
            background: rgba(26, 34, 53, 0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .light .glass {
            background: rgba(255, 255, 255, 0.75);
            border: 1px solid rgba(0, 0, 0, 0.08);
        }
        ::-webkit-scrollbar {
            width: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(148, 163, 184, 0.3);
            border-radius: 3px;
        }
        .metric-value {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.5px;
            font-variant-numeric: tabular-nums;
            font-family: 'JetBrains Mono', 'Inter', monospace;
        }
        .section-title {
            font-size: 0.75rem;
            font-weight: 700;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            color: var(--text-secondary);
            margin-bottom: 1rem;
        }
        @media (max-width: 1024px) {
            .sidebar {
                transform: translateX(-100%);
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main-content {
                margin-left: 0;
            }
            .top-bar {
                left: 0;
            }
        }
    </style>
</head>

        // ============ MOCK DATA ============
        const mockData = {

        function drawMiniCharts() {
            const chartCanvases = document.querySelectorAll('.mini-chart');
            chartCanvases.forEach(canvas => {
                const data = JSON.parse(canvas.getAttribute('data-values') || '[1,1.2,1.5,1.6,1.75,1.84]');
                const w = canvas.clientWidth || 200;
                const h = 60;
                const max = Math.max(...data);
                const min = Math.min(...data);
                const range = max - min || 1;
                let svg = `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="`;
                const step = w / (data.length - 1);
                data.forEach((v, i) => {
                    const x = i * step;
                    const y = h - ((v - min) / range) * (h - 10) - 5;
                    svg += `${x},${y} `;
                });
                svg +=
                    `" fill="none" stroke="#d4a843" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
                canvas.innerHTML = svg;
            });
        }

            const flows = document.querySelectorAll('.arch-flow-line');
            flows.forEach(line => {

        // ============ SIMULATED ACTIONS ============
        function simulateAction(type, subType) {
            const messages = {
                wallet: '✅ Demo wallet created!\n\nWallet ID: W-005\nCurrency: USD\nBalance: $0.00 (Demo)\n\nThis is a simulated action.',
                deposit: '💰 Demo deposit of $10,000 processed.\n\nLedger entries created.\nBalance updated.\n\nThis is a simulated action.',
                transfer: '↗️ Demo transfer of $5,000 completed.\n\nFX rate: 1.00 (simulated)\n\nThis is a simulated action.',
                payment: `💳 ${subType || 'Payment'} simulated successfully!\n\nAmount: $1,250.00\nStatus: Completed (Demo)\n\nThis is a simulated action.`,
                ai: '🤖 AI Response (Simulated):\n\n"Based on current data, all systems are operating within normal parameters. Portfolio growth remains strong at 12.4% MTD. No anomalies detected."\n\n⚠️ This is a local demo response. No external AI API is called.',
            };
            const msg = messages[type] || 'Action simulated successfully.';
            showToast(msg);
        }

        function showToast(message) {
            const existing = document.querySelector('.toast-notification');
            if (existing) existing.remove();
            const toast = document.createElement('div');
            toast.className =
                'toast-notification fixed bottom-6 right-6 z-50 glass rounded-xl p-4 max-w-sm shadow-2xl border border-gold-400/30';
            toast.style.color = 'var(--text-primary)';
            toast.innerHTML = `<pre class="text-xs whitespace-pre-wrap font-sans">${message}</pre>
            <button class="mt-2 text-xs text-gold-400 cursor-pointer hover:underline" onclick="this.parentElement.remove()">Dismiss</button>`;
            document.body.appendChild(toast);
            setTimeout(() => toast.remove(), 5000);
        }

        // ============ INVESTOR MODE ============
        function startInvestorMode() {
            investorStep = 0;
            investorActive = true;
            document.getElementById('investorOverlay').style.display = 'flex';
            showInvestorStep();
        }

        function showInvestorStep() {
            const step = investorSteps[investorStep];
            document.getElementById('investorStepContent').innerHTML = `
            <div class="text-4xl mb-3">${step.title.split(' ')[0]}</div>
            <h3 class="text-xl font-bold mb-2">${step.title}</h3>
            <p class="text-sm leading-relaxed">${step.content}</p>
            <p class="text-xs text-[var(--text-secondary)] mt-3">Step ${investorStep+1} of ${investorSteps.length}</p>
          `;
            navigateTo(step.page);
            document.getElementById('investorPrev').style.display = investorStep === 0 ? 'none' : 'inline-block';
            document.getElementById('investorNext').textContent =
                investorStep === investorSteps.length - 1 ? '🎉 Finish' : 'Next →';
        }

        function investorNext() {
            if (investorStep < investorSteps.length - 1) {
                investorStep++;
                showInvestorStep();
            } else {
                closeInvestorMode();
            }
        }

        function investorPrev() {
            if (investorStep > 0) {
                investorStep--;
                showInvestorStep();
            }
        }

        function closeInvestorMode() {
            investorActive = false;
            document.getElementById('investorOverlay').style.display = 'none';
            navigateTo('dashboard');
            showToast('✅ Investor tour complete! Explore the platform freely. All data is simulated.');
        }

        // ============ INITIALIZATION ============
        function init() {
            renderPage('dashboard');
            updatePageTitle('dashboard');
            // Handle sidebar close on mobile when clicking main content
            document.getElementById('mainContent').addEventListener('click', () => {
                if (window.innerWidth < 1024) {
                    document.getElementById('sidebar').classList.remove('open');
                }
            });
            // Keyboard navigation for investor mode
            document.addEventListener('keydown', (e) => {
                if (investorActive && e.key === 'Escape') closeInvestorMode();
                if (investorActive && e.key === 'ArrowRight') investorNext();
                if (investorActive && e.key === 'ArrowLeft') investorPrev();
            });
        }

        document.addEventListener('DOMContentLoaded', init);
    </script>
